wantType:
  metadata:
    name: gmail_list_unread
    title: Gmail Unread Important
    description: |
      Fetches unread important emails from Gmail via the list-unread-gmail skill.
      Calls python3 ~/.mywant/custom-types/mywant-gmail-list-unread-plugin/main.py.
      The skill outputs JSON; state fields with fetchFrom+onFetchData are populated automatically
      by EndProgressCycle after the MRS agent writes mrs_raw_output.
      Completes after a single execution.
    version: '1.0'
    category: gmail
    pattern: independent
    labels:
      # What the robot reads a request against, when it asks Laya which want
      # it is: the type in a few words of its own (laya-option).
      laya-option: "Gmailの未読メールを見る"
      aliases: "gmail,mail,未読メール"
      category-icon: Mail
      category-bg-light: "linear-gradient(160deg, #fecaca 0%, #fff1f2 100%)"
      category-bg-dark: "linear-gradient(160deg, #991b1b 0%, #450a0a 100%)"
      # What the tile shows at a glance: how many are waiting.
      tile-readout: count

  finalResultField: mrs_raw_output.emails

  # When it tells of its answer, besides every new one (the standard timing
  # "answer"). new_mail: an unread important mail on top that was not there
  # before (the newest one's subject moved), while there are any.
  timings:
    - name: new_mail
      description: 新しい重要メールが来たとき
      icon: mail
      if: count
      onChange: first_subject
      murmur: true
      notify: true

  state:
    - name: skill_timeout_seconds
      description: Max seconds to wait for the skill script to complete (default 120)
      type: int
      label: goal
      persistent: false
      initialValue: 120

    - name: skill_path
      description: Path to the MRS skill script (set by onInitialize)
      type: string
      label: current
      persistent: false
      initialValue: ""

    - name: mrs_raw_output
      description: Raw JSON output from the MRS skill (source for fetchFrom fields)
      type: object
      label: current
      persistent: false
      initialValue: null

    - name: error
      description: Error message if execution failed
      type: string
      label: current
      # NOT persistent, deliberately: this field is what finalizeWhen.failed
      # reads, so a value that survives a restart is a failure the want can
      # never be restarted out of — the monitor is cancelled in the same second
      # it boots, before it can try again. The skill's OUTPUT stays persistent;
      # the reason the last attempt failed is not an answer worth keeping.
      persistent: false
      initialValue: ""

    - name: count
      description: Number of unread important emails
      type: int
      label: current
      persistent: true
      initialValue: 0
      fetchFrom: mrs_raw_output
      onFetchData: "count"

    - name: summary
      description: Summary text of unread emails
      type: string
      label: current
      persistent: true
      initialValue: ""

    - name: first_sender
      description: Sender of the first unread email
      type: string
      label: current
      persistent: true
      initialValue: ""
      fetchFrom: mrs_raw_output
      onFetchData: "emails[0].sender"

    - name: first_subject
      description: Subject of the first unread email
      type: string
      label: current
      persistent: true
      initialValue: ""
      fetchFrom: mrs_raw_output
      onFetchData: "emails[0].subject"

    - name: first_date
      description: Date of the first unread email
      type: string
      label: current
      persistent: true
      initialValue: ""
      fetchFrom: mrs_raw_output
      onFetchData: "emails[0].date"

  finalizeWhen:
    achieved:
      field: mrs_raw_output
      operator: "!="
      value: null
    failed:
      field: error
      operator: "!="
      value: ""

  onInitialize:
    current:
      skill_path: "~/.mywant/custom-types/mywant-gmail-list-unread-plugin/main.py"

  requires:
    - monitor_mrs_agent

  examples:
    - name: Check Unread Gmail
      description: List unread important emails
      want:
        metadata:
          name: check_gmail
          type: gmail_list_unread

  # How a want of this type is asked for, in words, and what it is made with
  # (want-spec asks): what reads requests (the robot, Laya) learns from these
  # and is tested on them. A parameter left out is one the request does not say.
  asks:
    - say: "未読メール"
      variants: ["未読のメールを見せて", "まだ読んでないメール", "新着メール"]
    - say: "Gmailの未読を見せて"
      variants: ["Gmailの未読メール", "Gmailで読んでないメール", "Gmailの新着"]
